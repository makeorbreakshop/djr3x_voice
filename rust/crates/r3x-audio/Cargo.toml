[package]
name = "r3x-audio"
description = "Audio engine: device I/O (cpal), mixer with named buses and ramped ducking, speech sinks, mouth amplitude"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["device"]
# Real audio devices through cpal. Off = pure logic (mixer, sinks, analysis) for tests/headless.
device = ["dep:cpal"]

[dependencies]
tokio.workspace = true
tracing.workspace = true
anyhow.workspace = true
rtrb = "0.3"
cpal = { version = "0.18", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
