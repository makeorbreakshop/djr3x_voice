[package]
name = "r3x-beats"
description = "Tempo and beat grid per track (librosa beat_track, ported), disk cache, background analysis"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
r3x-audio = { path = "../r3x-audio", default-features = false, features = ["decode"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
realfft = "3"
sha1_smol = "1"
libc = "0.2"

[[bin]]
name = "r3x-beats"
path = "src/bin/r3x-beats.rs"
