[package]
name = "r3x-runtime"
description = "The r3x binary: bus, gateway, ops, stage manager; --bridge to a running CantinaOS"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "r3x-runtime"
path = "src/main.rs"

[dependencies]
r3x-contracts.workspace = true
r3x-bus.workspace = true
r3x-ops.workspace = true
r3x-stage.workspace = true
r3x-gateway.workspace = true
tokio = { workspace = true, features = ["signal"] }
serde_json.workspace = true
tracing.workspace = true
anyhow.workspace = true
uuid.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
