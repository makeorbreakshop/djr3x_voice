[package]
name = "r3x-runtime"
description = "The r3x binary: bus, gateway, ops, stage manager; --bridge to a running CantinaOS"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "r3x-runtime"
path = "src/main.rs"

[features]
# Global left-click push-to-talk (`--mouse`; macOS Accessibility permission).
mouse = ["r3x-voice/mouse"]

[dependencies]
r3x-contracts.workspace = true
r3x-bus.workspace = true
r3x-ops.workspace = true
r3x-stage.workspace = true
r3x-gateway.workspace = true
r3x-performer-core = { path = "../r3x-performer-core" }
r3x-drivers = { path = "../r3x-drivers" }
r3x-voice = { path = "../r3x-voice" }
tokio = { workspace = true, features = ["signal"] }
serde_json.workspace = true
tracing.workspace = true
anyhow.workspace = true
uuid.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
base64 = "0.23"
