[package]
name = "r3x-vision"
description = "Vision: camera (AVFoundation via ffmpeg), YuNet face detect + SFace embeddings on ort, gallery enrolment, presence, Claude scene description"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["coreml"]
# CoreML execution provider on macOS (CPU fallback when it cannot take the graph).
coreml = ["ort/coreml"]

[dependencies]
r3x-contracts.workspace = true
r3x-bus.workspace = true
r3x-ops.workspace = true
r3x-llm = { path = "../r3x-llm" }
r3x-memory = { path = "../r3x-memory" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
anyhow.workspace = true
tracing-subscriber.workspace = true
base64 = "0.22"
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "download-binaries", "copy-dylibs"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
