[package]
name = "r3x-performer-wasm"
description = "wasm-bindgen wrapper of r3x-performer-core for the browser sim (npm run build:wasm in sim/web)."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
r3x-performer-core = { path = "../r3x-performer-core" }
r3x-contracts.workspace = true
serde.workspace = true
serde_json.workspace = true
# Pinned to the wasm-bindgen CLI wasm-pack has cached, so a build needs no download.
wasm-bindgen = "=0.2.106"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]
