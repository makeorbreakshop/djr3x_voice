[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
r3x-contracts = { path = "crates/r3x-contracts" }
r3x-bus = { path = "crates/r3x-bus" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
ts-rs = { version = "12", features = ["serde-json-impl", "no-serde-warnings"] }
schemars = "1"
uuid = { version = "1", features = ["v4", "serde"] }
