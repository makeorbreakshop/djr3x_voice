[build]
target = "thumbv6m-none-eabi"  # RP2040: Cortex-M0+

[target.thumbv6m-none-eabi]
# flip-link: stack overflow faults instead of silently corrupting .data/.bss.
linker = "flip-link"
# `cargo run --release` flashes over SWD with a debug probe (e.g. a second Pico as picoprobe).
runner = "probe-rs run --chip RP2040"
rustflags = [
  "-C", "link-arg=--nmagic",
  "-C", "link-arg=-Tlink.x",
  "-C", "link-arg=-Tlink-rp.x",
  "-C", "link-arg=-Tdefmt.x",
]

[env]
DEFMT_LOG = "info"
