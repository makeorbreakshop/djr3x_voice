<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Talk to R3X</title>
    <style>
      :root { color-scheme: dark; --bg: #0d0f14; --fg: #e8e6df; --dim: #8a8f99; --accent: #f0a030; --live: #e0483a; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
        font: 16px/1.4 system-ui, sans-serif; }
      main { width: min(420px, calc(100vw - 32px)); display: grid; gap: 16px; text-align: center; }
      #talk { padding: 28px; font-size: 20px; border-radius: 16px; border: 2px solid var(--accent); background: transparent;
        color: var(--fg); touch-action: none; user-select: none; cursor: pointer; }
      #talk[data-state='listening'] { background: var(--live); border-color: var(--live); }
      #talk:disabled { opacity: 0.4; cursor: default; }
      #status, .label { color: var(--dim); font-size: 13px; }
      .line { min-height: 1.4em; }
      #mouth { height: 24px; width: 96px; margin: 0 auto; background: var(--accent); border-radius: 6px;
        transform: scaleY(0.1); transition: transform 30ms linear; }
    </style>
  </head>
  <body>
    <main>
      <div id="mouth" aria-hidden="true"></div>
      <button id="talk" disabled>Hold to talk</button>
      <div id="status">Connecting to the r3x gateway…</div>
      <div><div class="label">You said</div><div id="heard" class="line"></div></div>
      <div><div class="label">R3X</div><div id="said" class="line"></div></div>
    </main>
    <script type="module" src="/src/voice/page.ts"></script>
  </body>
</html>
